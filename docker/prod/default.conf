server {
  listen 80 default_server;
  root /var/www/html;
  index index.html;

  charset utf-8;

  # This is a static site, not an SPA: an unknown path must 404 rather than
  # silently serving the homepage with a 200 (which produced unlimited
  # duplicate content for crawlers and made Hugo's 404.html unreachable).
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Hugo fingerprints these filenames, so the content can never change
  # behind a given URL.
  location ~* "^/(css|js)/.+\.[0-9a-f]{32,}\.(css|js)$" {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  error_log  /var/log/nginx/error.log;
  access_log /var/log/nginx/access.log;

  client_max_body_size 100m;

  location ~ /.ht {
    deny all;
  }

  ##
  # `gzip` Settings
  ##

  gzip on;
  gzip_disable "msie6";

  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
}
