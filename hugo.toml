baseURL = 'https://thecodeboss.dev/'
locale = 'en-US'
title = 'Aaron Krauss | Developer'
googleAnalytics = 'G-WH3CEERYQX'
enableRobotsTXT = true

[permalinks]
  entry = '/:year/:month/:title/'

[params]
  dateFormat = "02 Jan 2006"
  logo = 'https://personal-k8s-main-space.nyc3.cdn.digitaloceanspaces.com/thecodeboss.dev/global/logo/logo.png'
  profile = 'https://personal-k8s-main-space.nyc3.cdn.digitaloceanspaces.com/thecodeboss.dev/pages/home/2023-profile-optimized.jpeg'
  description = "Hi, I'm Aaron Krauss, and I'm a software developer based in Oklahoma City, OK, currently working at Clevyr."
  images = [
    'https://personal-k8s-main-space.nyc3.cdn.digitaloceanspaces.com/thecodeboss.dev/global/opengraph/opengraph.jpg'
  ]

# Machine-readable output for AI crawlers (llmstxt.org):
#   /llms.txt       -- a Markdown index of the site, grouped by section
#   /llms-full.txt  -- the same index plus the full text of every page
#   <page>.md       -- a clean Markdown sibling for each entry and project
[outputFormats]
  [outputFormats.llms]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = 'text/plain'
    baseName = 'llms-full'
    isPlainText = true
    notAlternative = true
  [outputFormats.md]
    mediaType = 'text/markdown'
    suffixes = ['md']
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['html', 'rss', 'llms', 'llmsfull']
  page = ['html', 'md']
  section = ['html', 'rss']
  taxonomy = ['html', 'rss']
  term = ['html', 'rss']

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/watching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = 'assets/.*\.(js|ts)'
    target = 'js'
  [[build.cachebusters]]
    source = 'assets/.*\.(css)'
    target = 'css'

[menu]
[[menu.social]]
  identifier = 'github'
  name = 'My GitHub'
  url = 'https://github.com/alkrauss48'
  weight = 1
[[menu.social]]
  identifier = 'linked-in'
  name = 'My LinkedIn'
  url = 'https://www.linkedin.com/in/alkrauss48/'
  weight = 2
[[menu.social]]
  identifier = 'meetup'
  name = 'OKC WebDevs Meetup'
  url = 'https://www.meetup.com/okcwebdevs/'
  weight = 3

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'solarized-light'
    tabWidth = 4

# css.TailwindCSS shells out to the Tailwind CLI, which Hugo's default
# exec allowlist does not permit. Setting `allow` replaces the default
# list, so the defaults are restated here alongside tailwindcss.
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
