version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Grouped updates are supported now, so npm updates no longer need
      # to be disabled via open-pull-requests-limit: 0.
      minor-and-patch:
        update-types: ["minor", "patch"]
      dev-major:
        dependency-type: "development"
        update-types: ["major"]

  - package-ecosystem: "docker"
    directory: "/docker/prod/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
