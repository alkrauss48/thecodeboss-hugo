<header class="
  [ flex items-center justify-center ]
  [ w-full h-auto md:h-screen ]
">
  <section data-title="Main Heading" class="
    [ w-full max-w-xl mx-auto pt-24 pb-8 md:py-8 ]
    [ text-white text-3xl text-center bg-black/60 ]
  ">
    <p class="[ text-3xl md:text-5xl font-bold text-shadow ]">Hi, I'm</p>
    <h1 class="
      [ text-5xl md:text-6xl text-teal font-bold text-shadow ]
      [ mt-8 mb-16 ]
    ">Aaron Krauss</h1>
    <h2 class="[ text-3xl md:text-4xl font-bold text-shadow mb-16 ]">
      I'm a
      <noscript>
        <span class="text-orange">Developer</span>
      </noscript>
      <span id="typed" class="text-orange"></span>
    </h2>
    <nav>
      {{ partial "nav/social-list.html" (dict "itemClass" "mx-8" "linkWidth" "w-8") }}
    </nav>
  </section>
</header>
